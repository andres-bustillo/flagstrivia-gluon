name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Configurar GraalVM de Gluon para Java 17
      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.3.3'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Corregido el cierre de llave

      # 2. Configurar Java 17 (para que coincida con GraalVM)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Maven 3.8.8
      - name: Setup Maven 3.8.8
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.8.8

      # 4. Configurar NDK de Android
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      # 5. Instalar librerías del sistema para JavaFX
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      # 6. Compilar separando compile y link (workaround para el error ForceNoROSectionRelocations)
      - name: Gluon Build
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          mvn -Pandroid gluonfx:compile
          mvn -Pandroid gluonfx:link
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

      # 7. Preparar el APK
      - name: Make staging directory
        run: mkdir staging

      - name: Copy packages to staging
        run: cp -r target/gluonfx/aarch64-android/gvm/flagstrivia-gluon.* staging

      # 8. Subir el artefacto
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Flagstrivia-APK
          path: staging
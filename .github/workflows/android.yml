name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest # ¡Entorno Linux! Esto soluciona tu error.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      # Instalar GraalVM (GluonFX lo necesita para compilar nativo)
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '23'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Configurar Maven 3.8.8 (la versión que sabemos que funciona)
      - name: Setup Maven 3.8.8
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.8.8

      # Ejecutar la compilación de GluonFX
      - name: Build with GluonFX
        run: mvn clean gluonfx:build -Pandroid

      # Subir el APK generado para que lo puedas descargar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flagstrivia-apk
          path: target/gluonfx/*/flagstrivia-gluon.apk

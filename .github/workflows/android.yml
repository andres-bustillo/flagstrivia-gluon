name: Build Android App

on:
  push:
    branches: [ "main" ] # Cambiado a main, que es tu rama actual
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Configurar GraalVM para Java 23 (tu versión)
      - name: Setup GraalVM (Java 23)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '23'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configurar Java 23
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'

      # 3. Configurar Maven 3.8.8 (GluonFX no soporta Maven 3.9+)
      - name: Setup Maven 3.8.8
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.8.8

      # 4. Configurar NDK de Android
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false
      
      # 5. Instalar librerías del sistema requeridas por JavaFX
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      # 6. Compilar con GluonFX (sin firma ni subida a Google Play)
      - name: Gluon Build
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          mvn -Pandroid gluonfx:build
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

      # 7. Preparar el APK para descargar
      - name: Make staging directory
        run: mkdir staging

      - name: Copy packages to staging
        run: cp -r target/gluonfx/aarch64-android/gvm/flagstrivia-gluon.* staging

      # 8. Subir el APK como artefacto descargable
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Flagstrivia-APK
          path: staging